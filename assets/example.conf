# hyprnotice example config — drop into ~/.config/hypr/hyprnotice.conf.
# Every value below is the daemon's built-in default; comment a line to
# revert. Reload with `pkill -HUP hyprnotice` or by switching themes via
# lmtt (which sends the SIGHUP for you).

popup {
    # Anchor & layer: where popups stack.
    # anchor accepts a space/dash/underscore-separated list of
    # top|bottom|left|right.
    anchor = top right
    # layer in {background, bottom, top, overlay}. Overlay sits above all
    # normal windows including fullscreen ones.
    layer = overlay

    margin_top  = 12
    margin_left = 12

    width  = 360
    height = 110     # initial; auto-grows for body text

    # Used when a notification's expire_timeout is < 0 (i.e. "server
    # default"). expire_timeout=0 in the Notify call always means persistent.
    default_timeout = 5000

    # TODO(v0.6): cap on simultaneously visible popups.
    max_visible = 5
}

theme {
    # Override the lmtt-colors.css path. Empty = lmtt default
    # (~/.config/matugen/lmtt-colors.css).
    colors_path =
}
